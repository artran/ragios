# All paths below are relative to this configuration file (or may be absolute).
# HTTP defaults to 127.0.0.1:8080; no email is sent.
plugin_dir: plugins
database: ../var/ragios.sqlite3

# Optional; these are the defaults.
interval_seconds: 300
retry_interval_seconds: 60
confirmation_attempts: 3
timeout_seconds: 30
max_concurrent_checks: 20
max_output_bytes: 65536

hosts:
  - id: example-host
    name: Example host
    # Optional real reachability probe (requires an installed Nagios plugin).
    # address: example.invalid
    # reachability:
    #   probe: tcp
    #   executable: /usr/lib/nagios/plugins/check_tcp
    #   args: ["-H", "{{address}}", "-p", "443"]
    #   timeout_seconds: 10
    services:
      - id: example-service
        name: Example service
        executable: check_example
        args: []
